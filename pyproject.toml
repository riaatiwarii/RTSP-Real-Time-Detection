[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rtsp-real-time-detection"
version = "0.1.0"
description = "Production-grade RTSP Real-Time Detection Pipeline"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "ultralytics>=8.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["rtsp_pipeline*"]
