rtsp:
  url: "rtsp://admin:123456@192.168.0.166:554/ch01.264?dev=1"
  initial_reconnect_delay: 1.0
  max_reconnect_delay: 30.0
  max_retries: null  # null means retry indefinitely

sampling:
  target_fps: 5.0

models:
  yolo:
    weights: "yolov8n.pt"
    confidence_threshold: 0.5
  insightface:
    model_name: "buffalo_l"
    confidence_threshold: 0.5
    input_size: [640, 640]

output:
  frames_dir: "output/frames"
  logs_dir: "output/logs"
  metadata_filename: "detections.jsonl"
